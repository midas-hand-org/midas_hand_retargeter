retargeting:
  type: vector
  urdf_path: midas_hand_urdf.urdf

  # Active MIDAS joints only. Passive DIP/linkage joints are fixed during
  # option-1 retargeting and resolved by MuJoCo/API downstream.
  target_joint_names:
    - index_mcp_abad_joint
    - index_mcp_pitch_joint
    - index_pip_joint
    - middle_mcp_abad_joint
    - middle_mcp_pitch_joint
    - middle_pip_joint
    - ring_mcp_abad_joint
    - ring_mcp_pitch_joint
    - ring_pip_joint
    - thumb_cmc_roll_joint
    - thumb_cmc_side_joint
    - thumb_mcp_joint
    - thumb_dip_joint

  target_origin_link_names:
    - palm_base
    - palm_base
    - palm_base
    - palm_base
    - palm_base
    - palm_base
    - palm_base
    - palm_base
  target_task_link_names:
    - thumb_tip
    - thumb_mcp
    - index_tip
    - index_pip_link
    - middle_tip
    - middle_pip_link
    - ring_tip
    - ring_pip_link
  target_link_human_indices:
    - [0, 0, 0, 0, 0, 0, 0, 0]
    - [4, 3, 8, 7, 12, 11, 16, 15]

  scaling_factor: 1.15
  normal_delta: 0.004
  huber_delta: 0.02
  low_pass_alpha: 0.8
  has_joint_limits: true
