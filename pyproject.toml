[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-hand-retargeter"
version = "0.1.0"
description = "Vector-based MIDAS hand retargeting wrappers around dex_retargeting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dex_retargeting>=0.5.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
midas-retargeter-smoke = "midas_hand_retargeter.cli:smoke_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["midas_hand_retargeter*"]

[tool.setuptools.package-data]
midas_hand_retargeter = ["configs/*.yml"]

[tool.pytest.ini_options]
pythonpath = ["."]
