retargeting:
  type: vector
  urdf_path: assembly_1/urdf/assembly_1_rotated.urdf

  # Target refers to the retargeting target, which is the robot hand
  target_origin_link_names: [ "arm_interface", "arm_interface", "arm_interface", "arm_interface",
                              "arm_interface", "arm_interface", "arm_interface", "arm_interface" ]
  # Use tip + previous point constraints for each finger so distal joints are better excited.
  target_task_link_names: [ "thumb_dip", "xm335_case_m_dummy",
                            "dip_link_2", "pip_link_2",
                            "dip_link_1", "pip_link_1",
                            "dip_link", "pip_link" ]
  # assembly_1 has auxiliary joints (revolute_1_* / revolute_5_*) that
  # should not be optimized directly for teleop.
  target_joint_names: [ "revolute_1_3", "revolute_2_3", "revolute_3_3", "revolute_4_3",
                        "revolute_3_2", "revolute_4_2", "revolute_2_2",
                        "revolute_3_1", "revolute_4_1", "revolute_2_1",
                        "revolute_3_0", "revolute_4_0", "revolute_2_0" ]
  scaling_factor: 1.15

  # Source refers to the retargeting input, which usually corresponds to the human hand
  # The joint indices of human hand joint which corresponds to each link in the target_link_names
  target_link_human_indices: [ [ 0, 0, 0, 0, 0, 0, 0, 0 ],
                               [ 4, 3, 8, 7, 12, 11, 16, 15 ] ]

  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
  low_pass_alpha: 1.0
